  <style>
    /* Εισαγωγή DIY Punk & Fanzine Γραμματοσειρών */
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap');

    :root {
      --chrome-white: #f0f0f0;
      --punk-red: #8b0000;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Impact', sans-serif;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-color: #050505;
    }

    /* BACKGROUND WITH BLUR EFFECT */
    .bg-blurred {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      background: url('https://i.imgur.com/1udcNKO.jpg') no-repeat center center;
      background-size: cover;
      filter: blur(12px) brightness(0.35) grayscale(50%);
      transform: scale(1.05);
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(circle, rgba(120, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.8) 90%);
      pointer-events: none;
    }

    /* HEADER BANNER - ΔΙΟΡΘΩΜΕΝΟ ΠΕΡΙΘΩΡΙΟ (ΠΙΟ ΚΑΤΩ) */
    .header-banner {
      width: 100%;
      padding: 60px 50px 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 5;
    }

    .welcome-title {
      font-family: 'Special Elite', monospace;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 3px;
      color: #000;
      background: #fff;
      padding: 8px 18px;
      text-transform: uppercase;
      margin: 0;
      display: inline-block;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px var(--punk-red), 10px 10px 0px #000;
      transform: rotate(-2deg);
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 70px;
      margin-top: 10px;
      width: 100%;
      z-index: 2;
    }

    .slider-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-logo {
      max-width: 500px;
      width: 90%;
      min-height: 350px;
      object-fit: contain;
      border: 12px solid #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      transition: opacity 0.8s ease-in-out, transform 0.4s ease;
    }

    .main-logo:hover {
      transform: scale(1.02);
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 2px solid #fff;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px 10px;
      transition: all 0.3s ease;
      z-index: 10;
      border-radius: 3px;
    }

    .arrow-left { left: 15px; }
    .arrow-right { right: 15px; }

    .arrow:hover {
      background: #fff;
      color: #000;
    }

    .player-container {
      width: 550px;
      max-width: 90%;
      background: #000;
      border-radius: 2px;
      border: 4px solid var(--chrome-white);
      height: 300px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(1) grayscale(1) contrast(1.2) brightness(1.3);
    }

    .description {
      max-width: 700px;
      margin: 80px auto 40px;
      padding: 30px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid var(--chrome-white);
      border-bottom: 3px solid var(--chrome-white);
      font-family: 'Courier Prime', monospace;
      font-size: 1.1em;
      line-height: 1.6;
      text-align: left;
      z-index: 2;
    }

    .share-container {
      margin-bottom: 50px;
      z-index: 2;
    }

    .share-btn {
      background: #000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px 28px;
      font-family: 'Courier Prime', monospace;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 5px 5px 0px rgba(0,0,0,0.8);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .share-btn:hover {
      background: #fff;
      color: #000;
      box-shadow: 5px 5px 0px var(--punk-red);
    }

    .chat-wrapper {
      width: 700px;
      max-width: 90%;
      margin-bottom: 80px;
      background: #000;
      border: 3px solid var(--chrome-white);
      height: 380px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      z-index: 2;
    }

    .chat-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .social-links {
      margin-bottom: 80px;
      display: flex;
      gap: 70px;
      justify-content: center;
      z-index: 2;
    }

    .social-link img {
      width: 50px;
      filter: grayscale(100%) brightness(0.8);
      transition: 0.3s ease;
    }

    .social-link img:hover {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.1);
    }

    .events-section {
      width: 90%;
      max-width: 1000px;
      margin-bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .events-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 3.5rem;
      letter-spacing: 5px;
      margin-bottom: 25px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 4px 4px 0px #000;
      border-bottom: 4px solid var(--chrome-white);
      padding-bottom: 10px;
      width: 100%;
    }

    .events-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }

    .event-card {
      width: 400px;
      max-width: 100%;
      height: 520px;
      border: 8px solid #fff;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.7);
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s ease;
      box-sizing: border-box;
      overflow: hidden;
    }

    .event-card:hover {
      transform: scale(1.02);
    }

    .event-poster {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Modal Για Πλήρη Προβολή Εικόνας Events */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .image-modal-content {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    footer {
      padding: 40px;
      background: #000;
      width: 100%;
      color: #888;
      font-size: 0.8em;
      letter-spacing: 4px;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .header-banner {
        justify-content: center;
        padding: 30px 20px 10px;
      }
      .welcome-title {
        font-size: 1.2rem;
        transform: rotate(0deg);
      }
      .events-container {
        flex-direction: column;
      }
      .event-card {
        height: auto;
        max-height: 500px;
      }
    }

    @media (min-width: 1100px) {
      .hero-section {
        flex-direction: row;
        justify-content: center;
        gap: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-blurred"></div>
  <div class="bg-overlay"></div>

  <header class="header-banner">
    <h1 class="welcome-title">RUDE SOUNDS RADIO</h1>
  </header>

  <div class="hero-section">
    <div class="slider-container">
      <button class="arrow arrow-left" onclick="changeImage(-1)">❮</button>
      <img id="logoSlider" src="https://i.imgur.com/RvngBZz.jpg" alt="Rude Sounds Radio Logo" class="main-logo" loading="eager">
      <button class="arrow arrow-right" onclick="changeImage(1)">❯</button>
    </div>

    <div class="player-container">
      <iframe src="https://rudesounds.ismyradio.com/player" allow="autoplay" scrolling="no"></iframe>
    </div>
  </div>

  <div class="description">
    <p>
      <strong>Rude Sounds:</strong> Ο ήχος που μιλάει τη γλώσσα του δρόμου. 
      Φέρνουμε κοντά τον αυθεντικό ήχο του Oi!, της skinhead κουλτούρας και της reggae μουσικής.
    </p>
  </div>

  <div class="share-container">
    <button class="share-btn" onclick="copyWebsiteLink()" id="shareBtn">
      <span>🔗</span> COPY LINK
    </button>
  </div>

  <div class="chat-wrapper">
    <iframe src="https://www5.cbox.ws/box/?boxid=961981&boxtag=RmXNNb" width="100%" height="100%" frameborder="0"></iframe>
  </div>

  <div class="social-links">
    <a href="https://www.facebook.com/groups/608013455649231/" target="_blank" rel="noopener noreferrer" class="social-link">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook - Rude Sounds Group" loading="lazy">
    </a>
    <a href="https://www.instagram.com/rude_sounds69/" target="_blank" rel="noopener noreferrer" class="social-link">
      <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram - Rude Sounds 69" loading="lazy">
    </a>
  </div>

  <div class="events-section">
    <h2 class="events-title">EVENTS</h2>
    <div class="events-container">
      <div class="event-card" onclick="openModal('https://i.imgur.com/0sL1kXp.jpeg')">
        <img src="https://i.imgur.com/0sL1kXp.jpeg" alt="Rude Sounds Event Poster" class="event-poster" loading="lazy">
      </div>
      <div class="event-card" onclick="openModal('https://i.imgur.com/FoSpC8o.jpg')">
        <img src="https://i.imgur.com/FoSpC8o.jpg" alt="Rude Sounds Event Poster 2" class="event-poster" loading="lazy">
      </div>
    </div>
  </div>

  <!-- Lightbox Modal για τα Events -->
  <div id="eventModal" class="image-modal" onclick="closeModal()">
    <span class="image-modal-close" onclick="closeModal()">&times;</span>
    <img id="modalImg" class="image-modal-content" src="">
  </div>

  <footer>
    RUDE SOUNDS © 2025 | EVRIS
  </footer>

  <script>
    const images = [
      "https://i.imgur.com/RvngBZz.jpg",
      "https://i.imgur.com/MPLkicA.jpg"
    ];
    let currentImage = 0;

    function changeImage(direction) {
      currentImage += direction;
      if (currentImage >= images.length) currentImage = 0;
      if (currentImage < 0) currentImage = images.length - 1;
      document.getElementById("logoSlider").src = images[currentImage];
    }

    // Αλλαγή εικόνας κάθε 15 δευτερόλεπτα
    setInterval(() => changeImage(1), 15000);

    function copyWebsiteLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText("https://rudesounds.gr/").then(() => {
          showCopySuccess();
        }).catch(err => {
          console.error("Failed to copy link: ", err);
        });
      } else {
        const tempInput = document.createElement("input");
        tempInput.value = "https://rudesounds.gr/";
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        showCopySuccess();
      }
    }

    function showCopySuccess() {
      const btn = document.getElementById('shareBtn');
      if (btn) {
        btn.innerHTML = '✔ LINK COPIED!';
        setTimeout(() => { btn.innerHTML = '<span>🔗</span> COPY LINK'; }, 2000);
      }
    }

    // Λειτουργία για μεγέθυνση εικόνας Events
    function openModal(src) {
      const modal = document.getElementById("eventModal");
      const modalImg = document.getElementById("modalImg");
      modal.style.display = "flex";
      modalImg.src = src;
    }

    function closeModal() {
      document.getElementById("eventModal").style.display = "none";
    }
  </script>

</body>
</html>
