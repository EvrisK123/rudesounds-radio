  <style>
    /* Εισαγωγή γραμματοσειρών: Courier Prime & Permanent Marker */
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap');

    :root {
      --chrome-white: #f0f0f0;
      --oxblood-wall: #4a0000;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Impact', sans-serif;

    .arrow {

      border: 4px solid #fff;
      font-size: 2rem;
      cursor: pointer;
      padding: 10px 18px;
      transition: 0.3s;
    }

    .arrow:hover {
      background: #fff;
      color: #000;
    }

    .player-container {
      width: 550px;
      max-width: 90%;
      background: #000;
      border-radius: 2px;
      border: 4px solid var(--chrome-white);
      height: 300px;
      overflow: hidden;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(1) grayscale(1) contrast(1.2) brightness(1.3);
    }

    .description {
      max-width: 700px;
      margin: 120px auto 40px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.9);
      border-top: 3px solid var(--chrome-white);
      font-family: 'Courier Prime', monospace;
      font-size: 1.1em;
      line-height: 1.6;
      text-align: left;
    }

    /* Share Button Style */
    .share-container {
      margin-bottom: 60px;
    }

    .share-btn {
      background: #000;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px 28px;
      font-family: 'Courier Prime', monospace;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 5px 5px 0px #000;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .share-btn:hover {
      background: #fff;
      color: #000;
      box-shadow: 5px 5px 0px var(--oxblood-wall);
      transform: translateY(-2px);
    }

    .chat-wrapper {
      width: 700px;
      max-width: 90%;
      margin-bottom: 80px;
      background: #000;
      border: 2px solid var(--chrome-white);
      height: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .social-links {
      margin-bottom: 80px;
      display: flex;
      gap: 70px;
      justify-content: center;
    }

    .social-link img {
      width: 50px;
      filter: grayscale(100%) brightness(0.8);
      transition: 0.3s ease;
    }

    .social-link img:hover {
      filter: grayscale(0%) brightness(1);
      transform: scale(1.1);
    }

    /* Section Events */
    .events-section {
      width: 90%;
      max-width: 700px;
      margin-bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .events-title {
      font-family: 'Permanent Marker', cursive;
      font-size: 3.5rem;
      letter-spacing: 5px;
      margin-bottom: 25px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 4px 4px 0px #000;
      border-bottom: 4px solid var(--chrome-white);
      padding-bottom: 10px;
      width: 100%;
    }

    .event-poster {
      max-width: 480px;
      width: 100%;
      height: auto;
      border: 8px solid #fff;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.7);
      transition: transform 0.3s ease;
    }

    .event-poster:hover {
      transform: scale(1.02);
    }

    footer {
      padding: 60px;
      background: #000;
      width: 100%;
      color: #333;
      font-size: 0.8em;
      letter-spacing: 4px;

<body>

  <div class="hero-section">

    <div class="slider-container">

      <button class="arrow" onclick="changeImage(-1)">

      <img
        id="logoSlider"
        src="https://i.imgur.com/RvngBZz.jpg"
        alt="Rude Sounds Radio - Oi! Skinhead Reggae Northern Soul Web Radio"
        class="main-logo">

      <button class="arrow" onclick="changeImage(1)">
        ❯

    <div class="player-container">
      <iframe
        src="https://rudesounds.ismyradio.com/player"
        allow="autoplay"

  <div class="description">

	  και της reggae μουσικής.

  <script>
    // Slider logic
    const images = [
      "https://i.imgur.com/RvngBZz.jpg",
      "https://i.imgur.com/MPLkicA.jpg"
    ];

    let currentImage = 0;

    function changeImage(direction) {
      currentImage += direction;

      if (currentImage >= images.length) {
        currentImage = 0;
      }

      if (currentImage < 0) {
        currentImage = images.length - 1;
      }

      document.getElementById("logoSlider").src = images[currentImage];
    }

    // Απλή & αδιάβροχη αντιγραφή του link https://rudesounds.gr/
    function copyWebsiteLink() {
      var dummy = document.createElement("input");
      document.body.appendChild(dummy);
      dummy.value = "https://rudesounds.gr/";
      dummy.select();
      document.execCommand("copy");
      document.body.removeChild(dummy);

      var btn = document.getElementById('shareBtn');
      if (btn) {
        var originalText = btn.innerHTML;
        btn.innerHTML = '✔ LINK COPIED!';
        setTimeout(function() {
          btn.innerHTML = originalText;
        }, 2000);
      }
    }
  </script>

</body>
